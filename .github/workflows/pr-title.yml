# PR titles become commit messages on squash-merge, and release-please builds
# versions and the changelog from them — so they must be Conventional Commits:
#   feat(inventory): add traefik target type
#   fix: restore key permissions on rollback
name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - name: Check title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|security|docs|refactor|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$re"; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(inventory): add traefik target' or 'fix: …'. Got: $TITLE"
            exit 1
          fi
