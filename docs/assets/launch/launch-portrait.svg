<text x="40" y="222">k8s-prod</text><text x="210" y="222" fill="#9FB8B4">:443</text><text x="340" y="222"><tspan fill="#9FB8B4">OLD</tspan> → NEW</text><text x="896" y="222" fill="#4FD1C0" text-anchor="end">✓</text>
<line x1="40" y1="253.0" x2="896" y2="253.0" stroke="#24403C" stroke-dasharray="4 6"/>
<text x="40" y="300.3" font-size="20"><tspan fill="#4FD1C0">●</tspan> 3 servers updated, 0 rolled back</text></g></g>
