<text x="626" y="1023.75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#10201E">One .env file</text>
<text x="626" y="1060.75" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#4A5C59">nginx · apache · haproxy · minio</text>
