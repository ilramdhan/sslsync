<line x1="0" y1="60" x2="936" y2="60" stroke="#24403C"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#E6F2F0">
<text x="40" y="114">web-prod</text><text x="210" y="114" fill="#9FB8B4">:443</text><text x="340" y="114"><tspan fill="#9FB8B4">OLD</tspan> → NEW</text><text x="896" y="114" fill="#4FD1C0" text-anchor="end">✓</text>
