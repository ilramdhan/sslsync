<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d">
<title id="t">sslsync is now available</title>
<desc id="d">sslsync v0.1: every server, one command, new certificate verified or rolled back. Install with curl -fsSL ilramdhan.github.io/sslsync/install.sh | sh</desc>
<rect width="1080" height="1350" fill="#F4F8F7"/>
<rect width="1080" height="8" fill="#009485"/>
<text x="72" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="3" fill="#00695C">NOW AVAILABLE · v0.1</text>
<text x="72" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="88" font-weight="700" letter-spacing="-1.5" fill="#10201E">ssl<tspan fill="#009485">sync</tspan></text>
<text x="72" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-0.5" fill="#10201E">Every server. One command.</text>
<text x="72" y="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-0.5" fill="#00695C">New certificate,</text>
<text x="72" y="411" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-0.5" fill="#00695C">verified or rolled back.</text>
<g transform="translate(72 465)">
