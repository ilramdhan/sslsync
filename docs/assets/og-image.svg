<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img">
  <title>sslsync</title>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
  <rect width="1200" height="630" fill="#F4F8F7"/>
  <rect width="1200" height="8" fill="#009485"/>
  <g class="sans">
    <text x="80" y="170" font-size="92" font-weight="700" fill="#10201E" letter-spacing="-2">ssl<tspan fill="#009485">sync</tspan></text>
    <text x="80" y="262" font-size="30" font-weight="600" fill="#10201E">Every server. One command.</text>
    <text x="80" y="312" font-size="30" font-weight="600" fill="#00695C">New certificate,</text>
    <text x="80" y="362" font-size="30" font-weight="600" fill="#00695C">verified or rolled back.</text>
    <text x="80" y="420" font-size="22" fill="#4A5C59">Renews SSL/TLS certificates over SSH.</text>
  </g>
  <text x="80" y="480" class="mono" font-size="17" fill="#4A5C59">nginx · apache · haproxy · minio · postgres · k8s</text>
  <text x="80" y="560" class="mono" font-size="20" fill="#009485">ilramdhan.github.io/sslsync</text>
  <g transform="translate(680 150) scale(0.9)">
    <rect width="480" height="280" rx="16" fill="#0F1F1D" stroke="#24403C"/>
    <circle cx="28" cy="27" r="7" fill="#2F4A46"/><circle cx="50" cy="27" r="7" fill="#2F4A46"/><circle cx="72" cy="27" r="7" fill="#2F4A46"/>
    <text x="240" y="33" class="mono" font-size="14" fill="#9FB8B4" text-anchor="middle">$ sslsync deploy --group prod</text>
    <line x1="0" y1="54" x2="480" y2="54" stroke="#24403C"/>
    <g class="mono" font-size="18" fill="#E6F2F0">
      <text x="28" y="100">web-prod</text><text x="150" y="100" fill="#9FB8B4">:443</text><text x="230" y="100"><tspan fill="#9FB8B4">OLD</tspan> → NEW</text><text x="452" y="100" fill="#4FD1C0" text-anchor="end">✓</text>
      <text x="28" y="140">api-prod</text><text x="150" y="140" fill="#9FB8B4">:8443</text><text x="230" y="140"><tspan fill="#9FB8B4">OLD</tspan> → NEW</text><text x="452" y="140" fill="#4FD1C0" text-anchor="end">✓</text>
      <text x="28" y="180">k8s-prod</text><text x="150" y="180" fill="#9FB8B4">:443</text><text x="230" y="180"><tspan fill="#9FB8B4">OLD</tspan> → NEW</text><text x="452" y="180" fill="#4FD1C0" text-anchor="end">✓</text>
      <text x="28" y="240" font-size="17"><tspan fill="#4FD1C0">●</tspan> 3 servers updated, 0 rolled back</text>
    </g>
  </g>
</svg>
