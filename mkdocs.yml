site_name: sslsync
site_description: Renew SSL certificates on many servers over SSH — verified, with automatic rollback.
site_url: https://ilramdhan.github.io/sslsync/
site_author: Ilham Ramadhan
repo_url: https://github.com/ilramdhan/sslsync
repo_name: ilramdhan/sslsync
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Ilham Ramadhan

theme:
  name: material
  language: en
  icon:
    logo: material/certificate-outline
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - toc.follow

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started:
      - What is an SSL certificate?: getting-started/concepts.md
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quickstart.md
      - How it works: getting-started/how-it-works.md
  - Guides:
      - Renew a certificate: guides/renewal.md
      - Add a server: guides/add-server.md
      - Kubernetes: guides/kubernetes.md
      - Logs and audit trail: guides/logs.md
      - Troubleshooting: guides/troubleshooting.md
  - Reference:
      - Configuration (.env): reference/configuration.md
      - Target types: reference/targets.md
      - Commands: reference/commands.md
      - Edge cases: reference/edge-cases.md
  - About:
      - Security: about/security.md
      - Architecture: about/architecture.md
      - Development: about/development.md
      - Releases & CI/CD: about/releases.md
      - Contributing: about/contributing.md
      - Security policy: about/security-policy.md
      - Code of conduct: about/code-of-conduct.md
      - Accessibility: about/accessibility.md
      - License: about/license.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ilramdhan
